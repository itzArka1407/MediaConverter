[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-converter"
version = "0.3.2"
description = "Professional image & audio format converter"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.3,<12"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arkaprovo Das", email = "arkaprovodas2004@gmail.com" }]

[project.optional-dependencies]
avif = ["pillow-avif-plugin>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.6", "basedpyright", "pip-tools>=7.4"]

[project.scripts]
mediaconv = "converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pip-tools]
strip-extras = true

[tool.ruff]
line-length = 100

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.setuptools.data-files]
"share/man/man1" = ["man/mediaconv.1"]
