[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-converter"
version = "0.2.5"
description = "Professional image & audio format converter"
requires-python = ">=3.13"
dependencies = ["Pillow>=10.3,<12"]

[project.optional-dependencies]
avif = ["pillow-avif-plugin>=1.4"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pip-tools>=7.4"]

[project.scripts]
mediaconv = "converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pip-tools]
strip-extras = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.basedpyright]
typeCheckingMode = "standard"
